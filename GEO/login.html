<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>რეგისტრაცია</title>
  <link rel="stylesheet" href="login.css">
</head>

<body>

  <header>

    <div class="logo">WunderLust Travel</div>

    <nav>
        <li><a href="#">მთავარი</a></li>
        <li><a href="#">ქალაქები</a></li>
        <li><a href="#">ჩვენს შესახებ</a></li>
        <li><a href="#">კონტაქტი</a></li>
    </nav>

  </header>

  <section class="hero">

    <div class="form-box">

      <h1>რეგისტრაცია</h1>

      <div class="input-group">
        <label>სახელი</label>
        <input type="text" placeholder="შეიყვანე სახელი">
      </div>

      <div class="input-group">
        <label>ელ-ფოსტა</label>
        <input type="email" placeholder="შეიყვანე ელ-ფოსტა">
      </div>

      <div class="input-group">
        <label>პაროლი</label>
        <input type="password" placeholder="შეიყვანე პაროლი">
      </div>

      <div class="input-group">
        <label>გაიმეორე პაროლი</label>
        <input type="password" placeholder="გაიმეორე პაროლი">
      </div>

      <button>რეგისტრაცია</button>

      <div class="login-text">
        უკვე გაქვს ანგარიში?
        <a href="#">შესვლა</a>
      </div>

    </div>

  </section>


</body>
</html>
